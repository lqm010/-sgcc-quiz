<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>国网题库刷题</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --green:#00a663; --green-dark:#008a52; --green-light:#e7f7ef; --green-border:#c2e8d6;
  --blue:#3b82f6; --blue-light:#eaf2fe; --blue-border:#c7dcfb;
  --orange:#f59e0b; --orange-light:#fef4e6; --orange-border:#f8ddb0;
  --red:#ef4444; --red-light:#feecec; --red-border:#f8c9c9;
  --ink:#0f172a; --ink2:#64748b; --ink3:#94a3b8;
  --line:#e5e9f0; --bg:#f5f7fa; --card:#fff;
  --radius:16px;
  --shadow:0 2px 12px rgba(15,23,42,.06);
}
html { font-size:16px; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; touch-action:manipulation; -webkit-font-smoothing:antialiased; }
button { font-family:inherit; border:none; cursor:pointer; background:none; font-size:1rem; color:inherit; }
.view { display:none; }
.view.active { display:block; animation:fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
.container { max-width:720px; margin:0 auto; padding:0 16px 40px; }

/* ===== 首页 ===== */
.home-hero { background:linear-gradient(135deg,#00b06a 0%,#008a52 55%,#007544 100%); color:#fff; padding:20px 18px 22px; border-radius:0 0 26px 26px; box-shadow:0 8px 24px rgba(0,138,82,.25); }
.hero-top { max-width:720px; margin:0 auto; display:flex; align-items:center; gap:12px; }
.hero-top .logo { width:46px; height:46px; border-radius:14px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
.hero-top h1 { font-size:1.25rem; letter-spacing:.3px; }
.hero-top p { font-size:.78rem; opacity:.85; margin-top:3px; }
.stat-row { max-width:720px; margin:18px auto 0; display:flex; gap:8px; }
.stat-item { flex:1; background:rgba(255,255,255,.14); border-radius:14px; padding:10px 6px; text-align:center; }
.stat-item b { font-size:1.35rem; display:block; }
.stat-item span { font-size:.7rem; opacity:.85; }
.section { margin-top:22px; }
.section > h2 { font-size:1rem; margin-bottom:12px; display:flex; align-items:baseline; gap:8px; }
.section > h2::before { content:''; width:5px; height:16px; background:var(--green); border-radius:3px; align-self:center; }
.section > h2 span { font-size:.72rem; color:var(--ink3); font-weight:400; }
.range-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.range-card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; text-align:left; position:relative; box-shadow:var(--shadow); transition:transform .12s; }
.range-card:active { transform:scale(.97); }
.range-card .rng { font-weight:700; font-size:1.02rem; }
.range-card .rng small { color:var(--ink3); font-weight:400; font-size:.7rem; margin-left:6px; }
.range-card .cnt { font-size:.75rem; color:var(--ink2); margin-top:7px; }
.range-card .cnt b { color:var(--green); font-size:.9rem; }
.range-card .cnt.done b { color:var(--ink3); }
.mini-bar { height:5px; background:#eef1f5; border-radius:3px; margin-top:9px; overflow:hidden; }
.mini-bar i { display:block; height:100%; background:linear-gradient(90deg,var(--green),var(--green-dark)); border-radius:3px; }
.range-card .reset { position:absolute; top:11px; right:10px; width:26px; height:26px; border-radius:9px; background:#f0f3f7; color:var(--ink3); font-size:.8rem; display:flex; align-items:center; justify-content:center; }
.mode-card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; display:flex; align-items:center; gap:13px; width:100%; text-align:left; box-shadow:var(--shadow); transition:transform .12s; }
.mode-card:active { transform:scale(.97); }
.mode-card .mc-icon { width:48px; height:48px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:1.45rem; flex-shrink:0; }
.mode-card .mc-icon.random { background:linear-gradient(135deg,#5aa5ff,#2f6fe0); }
.mode-card .mc-icon.wrong { background:linear-gradient(135deg,#ff9a52,#e9722d); }
.mode-card .mc-icon.stats { background:linear-gradient(135deg,#7d8aa0,#4c5a72); }
.mode-card .mc-txt { flex:1; min-width:0; }
.mode-card .mc-txt b { font-size:.98rem; display:block; }
.mode-card .mc-txt span { font-size:.75rem; color:var(--ink2); margin-top:3px; display:block; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.two-col .mode-card { flex-direction:column; align-items:flex-start; gap:10px; }
.badge { background:var(--red); color:#fff; font-size:.66rem; border-radius:9px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
.resume-card { margin-top:16px; background:linear-gradient(135deg,#00b06a,#008a52); color:#fff; border-radius:18px; padding:16px 18px; display:flex; align-items:center; gap:13px; box-shadow:0 8px 22px rgba(0,138,82,.28); transition:transform .12s; }
.resume-card:active { transform:scale(.98); }
.resume-card .rc-icon { width:42px; height:42px; border-radius:13px; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:1.15rem; flex-shrink:0; }
.resume-card .rc-body { flex:1; min-width:0; }
.resume-card .rc-body b { font-size:1rem; display:block; }
.resume-card .rc-body span { font-size:.76rem; opacity:.9; display:block; margin-top:3px; }
.resume-card .rc-bar { height:5px; background:rgba(255,255,255,.28); border-radius:3px; margin-top:9px; overflow:hidden; }
.resume-card .rc-bar i { display:block; height:100%; background:#fff; border-radius:3px; transition:width .3s; }
.resume-card .rc-progress { opacity:.85 !important; margin-top:6px !important; }
.resume-card .rc-arrow { font-size:1.4rem; opacity:.8; flex-shrink:0; }
.footer-note { text-align:center; color:var(--ink3); font-size:.7rem; margin-top:30px; line-height:1.9; }

/* ===== 答题页 ===== */
.quiz-bar { position:sticky; top:0; z-index:30; background:linear-gradient(135deg,#00b06a,#008a52); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 12px; display:flex; align-items:center; gap:10px; }
.quiz-bar .back { color:#fff; font-size:1.4rem; width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
.quiz-bar .back:active { background:rgba(255,255,255,.18); }
.quiz-title { flex:1; min-width:0; }
.quiz-title b { font-size:.95rem; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.quiz-title span { font-size:.72rem; opacity:.85; }
.card-btn { background:rgba(255,255,255,.2); color:#fff; border-radius:11px; padding:8px 13px; font-size:.78rem; }
.card-btn:active { background:rgba(255,255,255,.32); }
.quiz-progress { height:4px; background:rgba(255,255,255,.22); }
.quiz-progress i { display:block; height:100%; background:#fff; border-radius:2px; width:0; transition:width .25s; }
.quiz-main { padding-top:16px; padding-bottom:96px; }
.q-meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.tag { font-size:.7rem; border-radius:8px; padding:3px 9px; font-weight:600; }
.tag.single { background:var(--green-light); color:var(--green-dark); }
.tag.multi { background:var(--blue-light); color:var(--blue); }
.tag.judge { background:var(--orange-light); color:#c27408; }
.tag.part { background:#eef1f5; color:var(--ink2); font-weight:400; }
.q-no { font-size:.78rem; color:var(--ink3); margin-left:auto; }
.stem { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px; margin-top:12px; font-size:1.03rem; line-height:1.85; box-shadow:var(--shadow); }
.opts { margin-top:13px; display:flex; flex-direction:column; gap:10px; }
.opts.judge { flex-direction:row; }
.opt { background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; display:flex; gap:12px; align-items:center; text-align:left; font-size:.98rem; line-height:1.6; width:100%; box-shadow:var(--shadow); transition:border-color .15s, background .15s; }
.opt:active { transform:scale(.98); }
.opt .let { width:30px; height:30px; min-width:30px; border-radius:10px; background:#f0f3f7; color:var(--ink2); font-weight:700; font-size:.85rem; display:flex; align-items:center; justify-content:center; transition:.15s; }
.opt .txt { flex:1; }
.opts.judge .opt { flex-direction:column; gap:6px; align-items:center; text-align:center; font-weight:700; font-size:1.05rem; padding:20px 8px; }
.opts.judge .opt .let { display:none; }
.opt.sel { border-color:var(--green); background:var(--green-light); }
.opt.sel .let { background:var(--green); color:#fff; }
.opt.ok { border-color:var(--green); background:var(--green-light); }
.opt.ok .let { background:var(--green); color:#fff; }
.opt.ok::after { content:'✓'; color:var(--green); font-weight:800; font-size:1.05rem; }
.opt.bad { border-color:var(--red); background:var(--red-light); }
.opt.bad .let { background:var(--red); color:#fff; }
.opt.bad::after { content:'✗'; color:var(--red); font-weight:800; font-size:1.05rem; }
.opt.dis { pointer-events:none; }
.opt.multi::before { content:''; width:20px; height:20px; border:2px solid #c6cdd6; border-radius:6px; flex-shrink:0; transition:.15s; }
.opt.multi.sel::before, .opt.multi.ok::before { border-color:var(--green); background:var(--green) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/14px no-repeat; }
.opt.multi.bad::before { border-color:var(--red); background:var(--red); }
.opt.multi.bad::after { margin-left:0; }
.confirm-bar { margin-top:13px; }
.btn-go { width:100%; background:linear-gradient(135deg,var(--green),var(--green-dark)); color:#fff; border-radius:13px; padding:15px; font-size:1.02rem; font-weight:700; box-shadow:0 6px 16px rgba(0,138,82,.3); transition:.15s; }
.btn-go:disabled { opacity:.4; box-shadow:none; }
.btn-go:active { transform:scale(.98); }
.result-bar { margin-top:13px; border-radius:14px; padding:14px 16px; display:flex; gap:10px; align-items:flex-start; line-height:1.6; animation:fadeIn .25s; }
.result-bar .ri { font-size:1.15rem; font-weight:800; line-height:1.3; }
.result-bar.good { background:var(--green-light); border:1.5px solid var(--green-border); color:var(--green-dark); }
.result-bar.bad { background:var(--red-light); border:1.5px solid var(--red-border); color:#c22b2f; }
.result-bar .bd b { font-size:.97rem; }
.result-bar .bd { font-size:.9rem; }
.result-bar .sub { font-size:.78rem; opacity:.78; margin-top:3px; }
.quiz-nav { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; max-width:720px; margin:0 auto; z-index:30; box-shadow:0 -4px 16px rgba(15,23,42,.06); }
.quiz-nav button { flex:1; padding:14px; border-radius:13px; font-size:.98rem; font-weight:700; }
.quiz-nav .pre { background:#f0f3f7; color:var(--ink2); }
.quiz-nav .next { background:var(--ink); color:#fff; }
.quiz-nav .next.done { background:linear-gradient(135deg,var(--green),var(--green-dark)); }
.quiz-nav button:disabled { opacity:.35; }

/* ===== 错题本/统计 顶部 ===== */
.sub-top { position:sticky; top:0; z-index:30; background:var(--card); border-bottom:1px solid var(--line); padding:calc(12px + env(safe-area-inset-top)) 16px 12px; }
.sub-top-inner { max-width:720px; margin:0 auto; display:flex; align-items:center; gap:8px; }
.sub-top .back { font-size:1.3rem; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.sub-top .back:active { background:#f0f3f7; }
.sub-top .tt { font-weight:700; font-size:1.05rem; flex:1; }
.empty-box { text-align:center; padding:70px 20px; color:var(--ink3); }
.empty-box .em { font-size:2.6rem; margin-bottom:12px; }
.empty-box p { font-size:.88rem; line-height:1.9; }
.wrong-actions { display:flex; gap:10px; margin:16px 0 14px; }
.btn-white { flex:1; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px; font-weight:600; color:var(--ink2); font-size:.9rem; }
.btn-white.danger { color:var(--red); border-color:var(--red-border); }
.btn-primary-soft { background:linear-gradient(135deg,var(--green),var(--green-dark)); color:#fff; border:none; }
.wrong-card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px; margin-bottom:11px; box-shadow:var(--shadow); }
.wrong-card .hd { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.wrong-card .qid { font-size:.75rem; color:var(--ink3); }
.wrong-card .date { font-size:.72rem; color:var(--ink3); margin-left:auto; }
.wrong-card .stem-line { font-size:.93rem; line-height:1.7; margin-top:10px; }
.wrong-card .ans-line { display:flex; gap:8px; margin-top:10px; font-size:.8rem; flex-wrap:wrap; }
.ans-chip { border-radius:8px; padding:4px 10px; }
.ans-chip.mine { background:var(--red-light); color:var(--red); }
.ans-chip.right { background:var(--green-light); color:var(--green-dark); }
.wrong-card .ft { display:flex; gap:8px; margin-top:12px; }
.wrong-card .ft button { font-size:.76rem; color:var(--ink3); padding:6px 11px; border-radius:9px; background:#f0f3f7; }
.wrong-card .ft button.del { color:var(--red); }
.wrong-card .detail { margin-top:12px; border-top:1px dashed var(--line); padding-top:12px; }
.wrong-card .detail .opt-line { font-size:.84rem; line-height:1.7; padding:6px 10px; border-radius:8px; margin-bottom:5px; }
.wrong-card .detail .opt-line.right { background:var(--green-light); }
.wrong-card .detail .opt-line.mine { background:var(--red-light); }
.wrong-card .detail .opt-line.right.mine { background:linear-gradient(90deg,var(--green-light),var(--red-light)); }

/* ===== 统计 ===== */
.stat-hero { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px 20px; margin-top:16px; text-align:center; box-shadow:var(--shadow); }
.stat-hero .big { font-size:2.8rem; font-weight:800; color:var(--green); }
.stat-hero .lab { color:var(--ink2); font-size:.84rem; margin-top:4px; }
.stat-hero .row { display:flex; justify-content:center; gap:28px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
.stat-hero .row .n { font-weight:700; font-size:1.2rem; }
.stat-hero .row .l { font-size:.72rem; color:var(--ink3); margin-top:2px; }
.type-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:10px; box-shadow:var(--shadow); }
.type-card .hd { display:flex; justify-content:space-between; align-items:center; }
.type-card .nm { font-weight:700; font-size:.94rem; }
.type-card .rt { font-weight:800; font-size:1.05rem; }
.rt.c1 { color:var(--green); } .rt.c2 { color:var(--blue); } .rt.c3 { color:#c27408; }
.type-card .mini-bar { margin-top:12px; }
.mini-bar i.c1 { background:var(--green); } .mini-bar i.c2 { background:var(--blue); } .mini-bar i.c3 { background:var(--orange); }
.type-card .info { font-size:.74rem; color:var(--ink3); margin-top:7px; }
.stat-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.stat-mini { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px; box-shadow:var(--shadow); }
.stat-mini .n { font-size:1.4rem; font-weight:800; }
.stat-mini .l { font-size:.74rem; color:var(--ink3); margin-top:3px; }

/* ===== 模态 ===== */
.mask { position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:100; display:none; align-items:center; justify-content:center; padding:24px; }
.mask.show { display:flex; animation:fadeIn .2s; }
.modal { background:#fff; border-radius:18px; padding:24px 20px; width:100%; max-width:380px; max-height:82vh; overflow:auto; }
.modal h3 { font-size:1.05rem; margin-bottom:12px; }
.modal .sc-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:12px 0 6px; }
.sc-grid button { aspect-ratio:1; border-radius:9px; background:#f0f3f7; color:var(--ink2); font-size:.8rem; font-weight:600; }
.sc-grid button.ok { background:var(--green-light); color:var(--green-dark); border:1.5px solid var(--green-border); }
.sc-grid button.bad { background:var(--red-light); color:var(--red); border:1.5px solid var(--red-border); }
.sc-grid button.cur { outline:2.5px solid var(--ink); outline-offset:1px; }
.sc-legend { display:flex; gap:13px; font-size:.7rem; color:var(--ink3); margin-bottom:4px; flex-wrap:wrap; }
.sc-legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
.modal .btns { display:flex; gap:10px; margin-top:16px; }
.modal .btns button { flex:1; padding:12px; border-radius:12px; font-weight:700; }
.modal .btns .primary { background:var(--green); color:#fff; }
.modal .btns .plain { background:#f0f3f7; color:var(--ink2); }
.modal .btns .red { background:var(--red); color:#fff; }
.score-box { text-align:center; padding:6px 0; }
.score-box .s1 { font-size:3rem; font-weight:800; }
.score-box .s1.g { color:var(--green); } .score-box .s1.r { color:var(--red); }
.score-box .srow { display:flex; justify-content:center; gap:22px; margin-top:16px; }
.score-box .srow .n { font-weight:700; font-size:1.15rem; }
.score-box .srow .l { font-size:.72rem; color:var(--ink3); margin-top:2px; }
.toast { position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:rgba(15,23,42,.92); color:#fff; padding:11px 20px; border-radius:99px; font-size:.84rem; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none; max-width:86vw; text-align:center; }
.toast.show { opacity:1; }

/* ===== 错题回顾 ===== */
.review-top { position:sticky; top:0; z-index:30; background:linear-gradient(135deg,#e9722d,#c2590f); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 14px; }
.review-top .rt-bar { display:flex; align-items:center; gap:10px; }
.review-top .back { color:#fff; font-size:1.4rem; width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
.review-top .back:active { background:rgba(255,255,255,.18); }
.review-top .tt { flex:1; }
.review-top .tt b { font-size:1rem; display:block; }
.review-top .tt span { font-size:.75rem; opacity:.85; }
.review-top .rt-actions { display:flex; gap:8px; margin-top:10px; }
.review-top .rt-actions button { flex:1; background:rgba(255,255,255,.2); color:#fff; border-radius:11px; padding:9px; font-size:.82rem; font-weight:600; }
.review-top .rt-actions button:active { background:rgba(255,255,255,.32); }
.review-top .rt-actions button.primary { background:#fff; color:#c2590f; }
.review-progress { height:4px; background:rgba(255,255,255,.22); }
.review-progress i { display:block; height:100%; background:#fff; border-radius:2px; width:0; transition:width .25s; }

/* 错题本分组 */
.wrong-group { margin-bottom:14px; }
.wrong-group-head { display:flex; align-items:center; gap:8px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow); }
.wrong-group-head:active { transform:scale(.99); }
.wrong-group-head .wg-title { font-weight:700; font-size:.92rem; flex:1; }
.wrong-group-head .wg-count { font-size:.76rem; color:var(--ink3); }
.wrong-group-head .wg-count b { color:var(--red); font-size:.88rem; }
.wrong-group-head .wg-arrow { font-size:1.1rem; color:var(--ink3); transition:transform .2s; }
.wrong-group.open .wg-arrow { transform:rotate(90deg); }
.wrong-group-body { display:none; }
.wrong-group.open .wrong-group-body { display:block; }
.wrong-group-actions { display:flex; gap:8px; margin-bottom:10px; }
.wrong-group-actions button { flex:1; padding:10px; border-radius:10px; font-size:.82rem; font-weight:600; }
.wrong-group-actions .redo { background:linear-gradient(135deg,var(--orange),#c27408); color:#fff; }
.wrong-group-actions .del { background:var(--red-light); color:var(--red); border:1px solid var(--red-border); }

/* ===== 搜题 ===== */
.search-bar { position:sticky; top:0; z-index:30; background:var(--card); border-bottom:1px solid var(--line); padding:calc(10px + env(safe-area-inset-top)) 14px 12px; }
.search-bar-inner { max-width:720px; margin:0 auto; display:flex; align-items:center; gap:8px; }
.search-input-wrap { flex:1; position:relative; }
.search-input-wrap input { width:100%; background:#f0f3f7; border:1.5px solid transparent; border-radius:12px; padding:11px 14px 11px 38px; font-size:.95rem; outline:none; transition:.15s; color:var(--ink); }

const RANGES = (()=>{ const r=[]; for(let i=1;i<=790;i+=100){ r.push([i, Math.min(i+99,790)]); } return r; })();

let wrong = store.get(LS.wrong, {});
let stats = store.get(LS.stats, {total:0, correct:0, types:[[0,0],[0,0],[0,0]], qids:{}});
let prog  = store.get(LS.prog, {});
let randS = store.get(LS.rand, null);
let memoPos = store.get(LS.memo, {}); // 背题进度：{ '1-100': idx, ... }
let session = null;
let multiSel = [];

function saveWrong(){ store.set(LS.wrong, wrong); }
function saveStats(){ store.set(LS.stats, stats); }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#v-'+name).classList.add('active');
  window.scrollTo(0,0);
  if(name==='home') renderHome();
  if(name==='wrong') renderWrong();
  if(name==='stats') renderStats();
  if(name==='search'){ buildGroupTabs(); doSearch(($('#search-input')||{value:''}).value.trim()); setTimeout(()=>{const si=$('#search-input'); if(si) si.focus();}, 60); }
  if(name==='review') renderReview();
}
function openModal(html){ $('#modal-box').innerHTML = html; $('#mask').classList.add('show'); }
function closeModal(){ $('#mask').classList.remove('show'); }
$('#mask').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(); });

function dispAns(q, ans){
  if(q[1]===2) return ans.split('、').map(l=>l==='A'?'正确':'错误').join('、');
  return ans;
}

/* ===== 首页 ===== */
function renderHome(){
  const doneQ = Object.keys(stats.qids).length;
  $('#h-done').textContent = doneQ;
  $('#h-rate').textContent = stats.total ? Math.round(stats.correct/stats.total*100)+'%' : '--';
  $('#h-wrong').textContent = Object.keys(wrong).length;
  // 继续上次刷题卡片
  const r = store.get(LS.resume, null);
  const resumeSec = $('#resume-section');
  const isMemoR = !!(r && r.mode === 'memorize');
  const unfinished = r && r.ids && r.ids.length && (isMemoR ? (r.idx < r.ids.length-1) : (Object.keys(r.answers).length < r.ids.length));
  if(unfinished){
    if(isMemoR){
      const pct = Math.round((r.idx+1)/r.ids.length*100);
      resumeSec.style.display = '';
      $('#resume-title').textContent = r.title;
      $('#resume-progress').textContent = `背到第 ${r.idx+1} / ${r.ids.length} 题`;
      $('#resume-bar').style.width = pct+'%';
    } else {
      const ansN = Object.keys(r.answers).length;
      const pct = Math.round(ansN/r.ids.length*100);
      resumeSec.style.display = '';
      $('#resume-title').textContent = r.title;
      $('#resume-progress').textContent = `已答 ${ansN} / ${r.ids.length} 题 · 做到第 ${r.idx+1} 题`;
      $('#resume-bar').style.width = pct+'%';
    }
  } else {
    resumeSec.style.display = 'none';
  }
  let html = '';
  RANGES.forEach(([s,e],i)=>{
    const key = s+'-'+e;
    const p = prog[key];
    const ansN = p ? Object.keys(p.answers).length : 0;
    const total = e-s+1;
    const pct = Math.round(ansN/total*100);
    const doneAll = ansN>=total;
    html += `<button class="range-card" onclick="startOrder(${i})">
      <div class="rng">${s} - ${e}<small>${pct>=100?'已完成':(p?'进行中':'未开始')}</small></div>
      <div class="cnt ${doneAll?'done':''}"><b>${ansN}</b> / ${total} 题</div>
      <div class="mini-bar"><i style="width:${pct}%"></i></div>
      <span class="reset" onclick="resetRange(event,'${key}')">↺</span>
    </button>`;
  });
  $('#range-grid').innerHTML = html;
  // 背题模式分段（带进度记忆）
  let memoHtml = '';
  RANGES.forEach(([s,e],i)=>{
    const key = s+'-'+e;
    const m = memoPos[key] || 0;
    const total = e-s+1;
    memoHtml += `<button class="range-card" onclick="startMemorize(${i})">
      <div class="rng">${s} - ${e}<small>背题</small></div>
      <div class="cnt">${m>0?`背到第 ${m+1}/${total} 题`:'直接看答案 · 快速记忆'}</div>
      ${m>0?`<div class="mini-bar"><i style="width:${Math.round(m/total*100)}%"></i></div>`:''}
      ${m>0?`<span class="reset" onclick="resetMemo(event,'${key}')">↺</span>`:''}
    </button>`;
  });
  $('#memo-grid').innerHTML = memoHtml;
  const hasR = randS && randS.ids && randS.ids.length;
  const rDone = hasR ? Object.keys(randS.answers).length : 0;
  if(hasR && rDone < randS.ids.length){
    $('#rand-title').textContent = `继续随机练习（${rDone}/${randS.ids.length}）`;
    $('#rand-desc').textContent = '点击继续上次未完成的题目';
  } else {
    $('#rand-title').textContent = '随机 100 题';
    $('#rand-desc').textContent = '乱序抽题 · 检验综合掌握';
  }
  const wn = Object.keys(wrong).length;
  $('#wrong-badge').style.display = wn ? '' : 'none';
  $('#wrong-badge').textContent = wn;
  $('#wrong-desc').textContent = wn ? `共 ${wn} 道待消灭` : '暂无错题';
  $('#stats-desc').textContent = stats.total ? `已作答 ${stats.total} 次` : '查看正确率';
}

function resetRange(ev, key){
  ev.stopPropagation();
  confirmBox(`重置区间 ${key}？`, '该区间答题进度将清空（错题本与统计不受影响）', ()=>{
    delete prog[key]; store.set(LS.prog, prog); renderHome();
  });
}
function resetMemo(ev, key){
  ev.stopPropagation();
  confirmBox(`重置背题 ${key}？`, '该区间背题进度将清空', ()=>{
    delete memoPos[key]; store.set(LS.memo, memoPos); renderHome();
  });
}
function confirmBox(title, desc, onOk, okText){
  openModal(`<h3>${title}</h3>
    <p style="font-size:.88rem;color:var(--ink2);line-height:1.7">${desc}</p>
    <div class="btns"><button class="plain" onclick="closeModal()">取消</button>
    <button class="red" id="cfm-ok">${okText||'确定'}</button></div>`);
  $('#cfm-ok').onclick = ()=>{ closeModal(); onOk(); };
}

/* ===== 会话 ===== */
function startOrder(i){
  const [s,e] = RANGES[i];
  const key = s+'-'+e;
  const ids = []; for(let id=s;id<=e;id++) ids.push(id);
  const p = prog[key];
  session = { mode:'order', title:`顺序刷题 ${key}`, ids, idx: p&&p.idx<ids.length?p.idx:0, answers: p?p.answers:{}, rangeKey:key };
  showView('quiz'); renderQuiz();
}
function startRandom(fresh){
  if(!fresh && randS && randS.ids && Object.keys(randS.answers).length < randS.ids.length){
    session = { mode:'random', title:'随机练习 100 题', ids:randS.ids, idx:Math.min(randS.idx, randS.ids.length-1), answers:randS.answers };
  } else {
    const pool = Q.map(q=>q[0]);
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    const ids = pool.slice(0,100);
    randS = { ids, idx:0, answers:{} };
    store.set(LS.rand, randS);
    session = { mode:'random', title:'随机练习 100 题', ids, idx:0, answers:{} };
    if(fresh) toast('已生成新的随机题目');
  }
  showView('quiz'); renderQuiz();
}
function startWrongRedo(){
  const ids = Object.keys(wrong).map(Number).sort((a,b)=>a-b);
  if(!ids.length){ toast('错题本是空的'); return; }
  session = { mode:'wrong', title:`错题重做（${ids.length} 题）`, ids, idx:0, answers:{} };
  showView('quiz'); renderQuiz();
}
function saveSession(){
  if(!session) return;
  if(session.mode==='order'){ prog[session.rangeKey] = { idx:session.idx, answers:session.answers }; store.set(LS.prog, prog); }
  else if(session.mode==='random'){ randS = { ids:session.ids, idx:session.idx, answers:session.answers }; store.set(LS.rand, randS); }
  // 记住"当前会话"，刷新后自动恢复（active=true）
  const done = Object.keys(session.answers).length;
  const finished = session.mode==='memorize' ? false : (done >= session.ids.length);
  store.set(LS.resume, { mode:session.mode, title:session.title, ids:session.ids, idx:session.idx, answers:session.answers, rangeKey:session.rangeKey||'', active:!finished });
}

/* 一键恢复上次刷题位置 */
function resumeLast(){
  const r = store.get(LS.resume, null);
  if(!r || !r.ids || !r.ids.length){ toast('没有可恢复的进度'); return; }
  session = { mode:r.mode, title:r.title, ids:r.ids, idx:Math.min(r.idx, r.ids.length-1), answers:r.answers, rangeKey:r.rangeKey };
  if(r.mode==='order') prog[r.rangeKey] = { idx:session.idx, answers:session.answers };
  else if(r.mode==='random') randS = { ids:session.ids, idx:session.idx, answers:session.answers };
  showView('quiz'); renderQuiz();
}

/* ===== 背题模式（直接显示答案，不判分） ===== */
function startMemorize(i){
  const [s,e] = RANGES[i];
  const key = s+'-'+e;
  const ids = []; for(let id=s;id<=e;id++) ids.push(id);
  const saved = memoPos[key] || 0;
  session = { mode:'memorize', title:`背题 ${s}-${e}`, ids, idx:Math.min(saved, ids.length-1), answers:{}, rangeKey:key };
  showView('quiz'); renderQuiz();
}
function renderMemorize(){
  const qid = session.ids[session.idx];
  const q = QMAP[qid];
  const total = session.ids.length;
  $('#q-title').textContent = session.title;
  $('#q-sub').textContent = `第 ${session.idx+1} / ${total} 题 · 题号 ${qid}`;
  $('#q-pbar').style.width = ((session.idx+1)/total*100)+'%';
  document.querySelector('.card-btn').style.display = 'none';
  const isJudge = q[1]===2;
  const letters = ['A','B','C','D','E','F'];
  const ansL = q[5].split('、');
  let optsHtml = '';
  q[4].forEach((text,oi)=>{
    const L = letters[oi];
    const isAns = ansL.includes(L);
    const cls = 'opt dis' + (isAns ? ' ok' : '');
    if(isJudge){
      optsHtml += `<div class="${cls}"><span class="txt">${esc(text)}</span></div>`;
    } else {
      optsHtml += `<div class="${cls}"><span class="let">${L}</span><span class="txt">${esc(text)}</span></div>`;
    }
  });
  $('#quiz-body').innerHTML = `
    <div class="q-meta">
      <span class="tag ${TYPE_TAG[q[1]]}">${TYPE_NAMES[q[1]]}</span>
      <span class="tag part">${esc(q[2])}</span>
      <span class="q-no">题号 ${qid}</span>
    </div>
    <div class="stem">${esc(q[3])}</div>
    <div class="opts ${isJudge?'judge':''}">${optsHtml}</div>`;
  $('#btn-pre').disabled = session.idx === 0;
  const nxt = $('#btn-next');
  const isLast = session.idx === total-1;
  nxt.classList.toggle('done', isLast);
  nxt.textContent = isLast ? '已背完' : '下一题';
  nxt.disabled = false;
  window.scrollTo(0,0);
}
function exitQuiz(){
  if(session && session.mode==='reviewRedo'){
    exitReviewRedo();
    return;
  }
  saveSession();
  // 主动退出：标记会话已结束，刷新时不再自动恢复（但保留"继续上次"入口）
  const r = store.get(LS.resume, null);
  if(r){ r.active = false; store.set(LS.resume, r); }
  session = null;
  showView('home');
}

/* ===== 答题 ===== */
function renderQuiz(){
  document.querySelector('.card-btn').style.display = '';
  if(session.mode==='memorize'){ renderMemorize(); return; }
  const qid = session.ids[session.idx];
  const q = QMAP[qid];
  const answered = session.answers[qid];
  const total = session.ids.length;
  $('#q-title').textContent = session.title;
  $('#q-sub').textContent = `第 ${session.idx+1} / ${total} 题 · 题号 ${qid}`;
  $('#q-pbar').style.width = ((session.idx+1)/total*100)+'%';
  multiSel = [];

  const isJudge = q[1]===2, isMulti = q[1]===1;
  const letters = ['A','B','C','D','E','F'];
  let optsHtml = '';
  q[4].forEach((text,oi)=>{
    const L = letters[oi];
    let cls = 'opt' + (isMulti ? ' multi' : '');
    let ev = '';
    if(answered){
      cls += ' dis';
      const ansL = q[5].split('、'), myL = answered.my.split('、');
      if(ansL.includes(L)) cls += ' ok';
      else if(myL.includes(L)) cls += ' bad';
    } else {
      ev = isMulti ? `onclick="toggleMulti('${L}')"` : `onclick="judge('${L}')"`;
    }
    if(isJudge){
      optsHtml += `<button class="${cls}" ${ev}><span class="txt">${esc(text)}</span></button>`;
    } else {
      optsHtml += `<button class="${cls}" ${ev}><span class="let">${L}</span><span class="txt">${esc(text)}</span></button>`;
    }
  });

  let midBar = '';
  if(!answered && isMulti){
    midBar = `<div class="confirm-bar"><button class="btn-go" id="btn-cfm" disabled onclick="confirmMulti()">请先勾选选项</button></div>`;
  }
  let resultBar = '';
  if(answered){
    const ok = answered.ok;
    resultBar = `<div class="result-bar ${ok?'good':'bad'}">
      <span class="ri">${ok?'✓':'✗'}</span>
      <div class="bd"><b>${ok?'回答正确':'回答错误'}</b>
      ${ok?'':`<div class="sub">正确答案：${dispAns(q,q[5])} · 你的答案：${dispAns(q,answered.my)}</div>`}
      ${isMulti&&!ok?'<div class="sub">多选题需全部选对才算正确</div>':''}
      </div></div>`;
  }

  $('#quiz-body').innerHTML = `
    <div class="q-meta">
      <span class="tag ${TYPE_TAG[q[1]]}">${TYPE_NAMES[q[1]]}</span>
      <span class="tag part">${esc(q[2])}</span>
      <span class="q-no">题号 ${qid}</span>
    </div>
    <div class="stem">${esc(q[3])}</div>
    <div class="opts ${isJudge?'judge':''}">${optsHtml}</div>
    ${midBar}
    ${resultBar}`;

  // 底部导航
  const isLast = session.idx === total-1;
  const allDone = Object.keys(session.answers).length >= total;
  $('#btn-pre').disabled = session.idx === 0;
  const nxt = $('#btn-next');
  nxt.disabled = false;
  nxt.classList.toggle('done', isLast);
  nxt.textContent = isLast ? (allDone?'完成练习':'最后一题') : '下一题';

  if(!answered && isMulti) updateMultiBtn();
  window.scrollTo(0,0);
}

function toggleMulti(L){
  const i = multiSel.indexOf(L);
  if(i>=0) multiSel.splice(i,1); else multiSel.push(L);
  multiSel.sort();
  document.querySelectorAll('#quiz-body .opt').forEach(btn=>{
    const letEl = btn.querySelector('.let');
    if(!letEl) return;
    btn.classList.toggle('sel', multiSel.includes(letEl.textContent));
  });
  updateMultiBtn();
}
function updateMultiBtn(){
  const b = $('#btn-cfm'); if(!b) return;
  b.disabled = multiSel.length===0;
  b.textContent = multiSel.length ? `确认答案（已选 ${multiSel.length} 项）` : '请先勾选选项';
}
function confirmMulti(){ if(multiSel.length) judge(multiSel.join('、')); }

function judge(my){
  const qid = session.ids[session.idx];
  const q = QMAP[qid];
  const ok = my === q[5];
  session.answers[qid] = { my, ok };
  // reviewRedo 模式不存档：不影响统计、错题本、进度
  if(session.mode !== 'reviewRedo'){
    stats.total++; if(ok) stats.correct++;
    const t = q[1];
    stats.types[t][0]++; if(ok) stats.types[t][1]++;
    const rec = stats.qids[qid] || (stats.qids[qid]=[0,0]);
    rec[0]++; if(ok) rec[1]++;
    saveStats();
    if(!ok){
      const isNew = !wrong[qid];
      wrong[qid] = { my, ts: Date.now() };
      saveWrong();
      toast(isNew ? '已自动加入错题本' : '已更新错题记录');
    }
    saveSession();
  }
  renderQuiz();
}

function go(dir){
  const total = session.ids.length;
  const next = session.idx + dir;
  if(next < 0) return;
  if(session.mode==='memorize'){
    if(next >= total){ toast('已背完本组全部题目'); return; }
    session.idx = next;
    memoPos[session.rangeKey] = session.idx;
    store.set(LS.memo, memoPos);
    saveSession();
    renderQuiz();
    return;
  }
  if(next >= total){
    if(session.mode==='reviewRedo'){ finishReviewRedo(); return; }
    finishQuiz(); return;
  }
  session.idx = next;
  if(session.mode !== 'reviewRedo') saveSession();
  renderQuiz();
}
function finishQuiz(){
  const total = session.ids.length;
  const ansN = Object.keys(session.answers).length;
  const okN = Object.values(session.answers).filter(a=>a.ok).length;
  const rate = ansN ? Math.round(okN/ansN*100) : 0;
  const wrongIds = Object.entries(session.answers).filter(([k,v])=>!v.ok).map(([k])=>parseInt(k));
  const hasWrong = wrongIds.length > 0;
  let btnsHtml = '';
  if(hasWrong){
    btnsHtml += `<button class="plain" style="background:var(--orange-light);color:#c27408;border:1.5px solid var(--orange-border)" onclick="closeModal();startReview()">📋 错题回顾（${wrongIds.length}题）</button>`;
  }
  btnsHtml += `<button class="primary" onclick="closeModal();exitQuiz()">返回首页</button>`;
  openModal(`<div class="score-box">
    <div class="s1 ${rate>=60?'g':'r'}">${rate}%</div>
    <div style="color:var(--ink2);font-size:.84rem;margin-top:4px">本批正确率</div>
    <div class="srow">
      <div class="it"><div class="n">${ansN}</div><div class="l">作答 / ${total}</div></div>
      <div class="it"><div class="n" style="color:var(--green)">${okN}</div><div class="l">答对</div></div>
      <div class="it"><div class="n" style="color:var(--red)">${ansN-okN}</div><div class="l">答错</div></div>
    </div>
    <div style="font-size:.74rem;color:var(--ink3);margin-top:16px;line-height:1.8">
      ${ansN<total ? `还有 ${total-ansN} 题未作答` : '全部题目已作答完成'}<br>答错的题目已自动加入错题本
    </div>
    <div class="btns" style="flex-wrap:wrap">${btnsHtml}</div></div>`);
}
function openCard(){
  const total = session.ids.length;
  let grid = '';
  for(let i=0;i<total;i++){
    const qid = session.ids[i];
    const a = session.answers[qid];
    let cls = '';
    if(a) cls = a.ok?'ok':'bad';
    if(i===session.idx) cls += ' cur';
    grid += `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  }
  openModal(`<h3>答题卡 <span style="font-size:.72rem;color:var(--ink3);font-weight:400">${session.title}</span></h3>
    <div class="sc-legend">
      <span><i style="background:var(--green-light);border:1px solid var(--green-border)"></i>答对</span>
      <span><i style="background:var(--red-light);border:1px solid var(--red-border)"></i>答错</span>
      <span><i style="background:#f0f3f7"></i>未答</span>
      <span><i style="background:#fff;outline:1.5px solid var(--ink)"></i>当前</span>
    </div>
    <div class="sc-grid">${grid}</div>
    <div class="btns"><button class="primary" onclick="closeModal()">关闭</button></div>`);
}
function jumpTo(i){ session.idx = i; saveSession(); closeModal(); renderQuiz(); }

/* ===== 错题本 ===== */
function renderWrong(){
  const ids = Object.keys(wrong).map(Number).sort((a,b)=>a-b);
  const box = $('#wrong-body');
  if(!ids.length){
    box.innerHTML = `<div class="empty-box"><div class="em">🎉</div><p><b>错题本是空的</b><br>刷题时答错的题目会自动出现在这里</p></div>`;
    return;
  }
  let html = `<div class="wrong-actions">
    <button class="btn-white btn-primary-soft" onclick="startWrongRedo()">▶ 重做全部（${ids.length}）</button>
    <button class="btn-white danger" onclick="clearWrong()">清空错题本</button>
  </div>`;
  // 按 1-100/101-200 分组
  RANGES.forEach(([s,e])=>{
    const groupIds = ids.filter(qid => qid>=s && qid<=e);
    if(!groupIds.length) return;
    const key = s+'-'+e;
    html += `<div class="wrong-group" id="wg-${key}">
      <div class="wrong-group-head" onclick="toggleWrongGroup('${key}')">
        <span class="wg-title">${s} - ${e}</span>
        <span class="wg-count"><b>${groupIds.length}</b> 道错题</span>
        <span class="wg-arrow">›</span>
      </div>
      <div class="wrong-group-body">
        <div class="wrong-group-actions">
          <button class="redo" onclick="startWrongRedoGroup('${key}')">▶ 重做本组（${groupIds.length}）</button>
          <button class="del" onclick="clearWrongGroup('${key}',${s},${e})">清空本组</button>
        </div>`;
    groupIds.forEach(qid=>{
      const q = QMAP[qid];
      const w = wrong[qid];
      html += `<div class="wrong-card" id="wc-${qid}">
        <div class="hd">
          <span class="tag ${TYPE_TAG[q[1]]}">${TYPE_NAMES[q[1]]}</span>
          <span class="tag part">${esc(q[2])}</span>
          <span class="qid">题号 ${qid}</span>
          <span class="date">${new Date(w.ts).toLocaleDateString()}</span>
        </div>
        <div class="stem-line">${esc(q[3])}</div>
        <div class="ans-line">
          <span class="ans-chip mine">我的答案：${dispAns(q,w.my)}</span>
          <span class="ans-chip right">正确答案：${dispAns(q,q[5])}</span>
        </div>
        <div class="detail">${q[4].map((t,oi)=>{
          const L=['A','B','C','D'][oi];
          const ansL=q[5].split('、'), myL=w.my.split('、');
          let c='';
          if(ansL.includes(L)&&myL.includes(L)) c='right mine';
          else if(ansL.includes(L)) c='right';
          else if(myL.includes(L)) c='mine';
          return `<div class="opt-line ${c}">${L}. ${esc(t)}</div>`;
        }).join('')}</div>
        <div class="ft">
          <button class="del" onclick="removeWrong(${qid})">移除本题</button>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  box.innerHTML = html;
}
function toggleWrongGroup(key){
  const g = $('#wg-'+key);
  if(g) g.classList.toggle('open');
}
function startWrongRedoGroup(key){
  const [s,e] = key.split('-').map(Number);
  const ids = Object.keys(wrong).map(Number).filter(qid=>qid>=s&&qid<=e).sort((a,b)=>a-b);
  if(!ids.length){ toast('该分组无错题'); return; }
  session = { mode:'wrong', title:`错题重做 ${key}（${ids.length} 题）`, ids, idx:0, answers:{} };
  showView('quiz'); renderQuiz();
}
function clearWrongGroup(key, s, e){
  const ids = Object.keys(wrong).map(Number).filter(qid=>qid>=s&&qid<=e);
  if(!ids.length) return;
  confirmBox(`清空分组 ${key}？`, `将删除该分组下 ${ids.length} 道错题记录，此操作不可恢复。`, ()=>{
    ids.forEach(qid=>delete wrong[qid]);
    saveWrong(); renderWrong(); toast('已清空该分组错题');
  }, '清空');
}
function removeWrong(qid){ delete wrong[qid]; saveWrong(); renderWrong(); toast('已从错题本移除'); }
function clearWrong(){
  const n = Object.keys(wrong).length;
  if(!n) return;
  confirmBox('清空错题本？', `将删除全部 ${n} 道错题记录，此操作不可恢复。`, ()=>{ wrong = {}; saveWrong(); renderWrong(); toast('错题本已清空'); }, '清空');
}

/* ===== 统计 ===== */
function renderStats(){
  const doneQ = Object.keys(stats.qids).length;
  const rate = stats.total ? Math.round(stats.correct/stats.total*100) : 0;
  const tn = [['单选题','c1'],['多选题','c2'],['判断题','c3']];
  let typeHtml = '';
  stats.types.forEach((t,i)=>{
    const r = t[0] ? Math.round(t[1]/t[0]*100) : 0;
    typeHtml += `<div class="type-card">
      <div class="hd"><span class="nm">${tn[i][0]}</span><span class="rt ${tn[i][1]}">${t[0]?r+'%':'--'}</span></div>
      <div class="mini-bar"><i class="${tn[i][1]}" style="width:${r}%"></i></div>
      <div class="info">已作答 ${t[0]} 次 · 答对 ${t[1]} 次</div>
    </div>`;
  });
  $('#stats-body').innerHTML = `
    <div class="stat-hero">
      <div class="big">${stats.total?rate+'%':'--'}</div>
      <div class="lab">总正确率（按作答次数计算）</div>
      <div class="row">
        <div class="it"><div class="n">${stats.total}</div><div class="l">总作答次数</div></div>
        <div class="it"><div class="n" style="color:var(--green)">${stats.correct}</div><div class="l">答对次数</div></div>
        <div class="it"><div class="n" style="color:var(--red)">${stats.total-stats.correct}</div><div class="l">答错次数</div></div>
      </div>
    </div>
    <div class="stat-grid2">
      <div class="stat-mini"><div class="n">${doneQ}<span style="font-size:.85rem;color:var(--ink3);font-weight:400"> / 790</span></div><div class="l">已刷过的题目数</div></div>
      <div class="stat-mini"><div class="n" style="color:var(--red)">${Object.keys(wrong).length}</div><div class="l">当前错题数</div></div>
    </div>
    <div class="section" style="margin-top:14px">${typeHtml}</div>
    <div class="section">
      <h2>数据备份<span>换手机 / 清缓存前先备份</span></h2>
      <div class="two-col">
        <button class="mode-card" onclick="exportData()">
          <div class="mc-icon" style="background:linear-gradient(135deg,#5aa5ff,#2f6fe0)">⬇</div>
          <div class="mc-txt"><b>导出备份</b><span>保存进度到文件</span></div>
        </button>
        <button class="mode-card" onclick="triggerImport()">
          <div class="mc-icon" style="background:linear-gradient(135deg,#7d8aa0,#4c5a72)">⬆</div>
          <div class="mc-txt"><b>导入备份</b><span>从文件恢复进度</span></div>
        </button>
      </div>
    </div>
    <div class="section">
      <button class="btn-white danger" style="width:100%" onclick="resetAll()">重置全部数据（进度 / 统计 / 错题本）</button>
    </div>`;
}
function resetAll(){
  confirmBox('重置全部数据？', '将清空答题进度、统计记录和错题本，不可恢复。', ()=>{
    wrong = {}; stats = {total:0,correct:0,types:[[0,0],[0,0],[0,0]],qids:{}}; prog = {}; randS = null; memoPos = {};
    [LS.wrong,LS.stats,LS.prog,LS.rand,LS.resume,LS.memo].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
    renderStats(); toast('已重置全部数据');
  },'全部清空');
}

/* ===== 数据备份 / 恢复（换手机、清缓存不丢记录） ===== */
function exportData(){
  const data = { wrong, stats, prog, randS, memoPos, resume:store.get(LS.resume,null), exportedAt:new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '国网题库进度备份.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('已导出进度备份文件');
}
function triggerImport(){ $('#import-file').click(); }
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(d.stats){ stats = d.stats; store.set(LS.stats, stats); }
      if(d.wrong){ wrong = d.wrong; store.set(LS.wrong, wrong); }
      if(d.prog){ prog = d.prog; store.set(LS.prog, prog); }
      if(d.randS){ randS = d.randS; store.set(LS.rand, randS); }
      if(d.memoPos){ memoPos = d.memoPos; store.set(LS.memo, memoPos); }
      if(d.resume !== undefined){ store.set(LS.resume, d.resume); }
      renderStats(); renderHome();
      toast('已恢复进度备份');
    }catch(err){ toast('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file);
}

function finishReviewRedo(){
  const total = session.ids.length;
  const ansN = Object.keys(session.answers).length;
  const okN = Object.values(session.answers).filter(a=>a.ok).length;
  const rate = ansN ? Math.round(okN/ansN*100) : 0;
  openModal(`<div class="score-box">
    <div class="s1 ${rate>=60?'g':'r'}">${rate}%</div>
    <div style="color:var(--ink2);font-size:.84rem;margin-top:4px">重做正确率（不记档）</div>
    <div class="srow">
      <div class="it"><div class="n">${ansN}</div><div class="l">作答 / ${total}</div></div>
      <div class="it"><div class="n" style="color:var(--green)">${okN}</div><div class="l">答对</div></div>
      <div class="it"><div class="n" style="color:var(--red)">${ansN-okN}</div><div class="l">答错</div></div>
    </div>
    <div style="font-size:.74rem;color:var(--ink3);margin-top:16px;line-height:1.8">
      本次重做不影响错题本和统计数据
    </div>
    <div class="btns">
      <button class="plain" onclick="closeModal()">继续查看</button>
      <button class="primary" onclick="closeModal();exitReviewRedo()">返回首页</button>
    </div></div>`);
}
function exitReviewRedo(){
  // 清除重做 session，恢复原 session，回首页
  session = null;
  reviewSession = null;
  // 标记 resume 已结束
  const r = store.get(LS.resume, null);
  if(r){ r.active = false; store.set(LS.resume, r); }
  showView('home');
}

/* ===== 错题回顾（当前会话错题，独立于错题本） ===== */
let reviewSession = null; // { ids, idx, title, sourceSession }

function startReview(){
  if(!session) return;
  const wrongIds = Object.entries(session.answers).filter(([k,v])=>!v.ok).map(([k])=>parseInt(k));
  if(!wrongIds.length){ toast('本次没有错题'); return; }
  reviewSession = { ids: wrongIds, idx: 0, title: `错题回顾（${wrongIds.length} 题）`, sourceSession: session };
  session = null; // 暂存原 session
  showView('review');
}
function renderReview(){
  if(!reviewSession){ showView('home'); return; }
  const { ids, idx, title } = reviewSession;
  const total = ids.length;
  const qid = ids[idx];
  const q = QMAP[qid];
  $('#rv-title').textContent = title;
  $('#rv-sub').textContent = `第 ${idx+1} / ${total} 题 · 题号 ${qid}`;
  $('#rv-pbar').style.width = ((idx+1)/total*100)+'%';
  const isJudge = q[1]===2;
  const letters = ['A','B','C','D','E','F'];
  const ansL = q[5].split('、');
  let optsHtml = '';
  q[4].forEach((text,oi)=>{
    const L = letters[oi];
    const isAns = ansL.includes(L);
    const cls = 'opt dis' + (isAns ? ' ok' : '');
    if(isJudge){
      optsHtml += `<div class="${cls}"><span class="txt">${esc(text)}</span></div>`;
    } else {
      optsHtml += `<div class="${cls}"><span class="let">${L}</span><span class="txt">${esc(text)}</span></div>`;
    }
  });
  $('#review-body').innerHTML = `
    <div class="q-meta">
      <span class="tag ${TYPE_TAG[q[1]]}">${TYPE_NAMES[q[1]]}</span>
      <span class="tag part">${esc(q[2])}</span>
      <span class="q-no">题号 ${qid}</span>
    </div>
    <div class="stem">${esc(q[3])}</div>
    <div class="opts ${isJudge?'judge':''}">${optsHtml}</div>`;
  $('#rv-pre').disabled = idx === 0;
  const isLast = idx === total-1;
  $('#rv-next').classList.toggle('done', isLast);
  $('#rv-next').textContent = isLast ? '已回顾完' : '下一题';
  window.scrollTo(0,0);
}
function reviewGo(dir){
  if(!reviewSession) return;
  const total = reviewSession.ids.length;
  const next = reviewSession.idx + dir;
  if(next < 0) return;
  if(next >= total){ toast('已回顾完所有错题'); return; }
  reviewSession.idx = next;
  renderReview();
}
function exitReview(){
  // 恢复原 session
  if(reviewSession && reviewSession.sourceSession){
    session = reviewSession.sourceSession;
  }
  reviewSession = null;
  showView('home');
}
function startReviewRedo(){
  if(!reviewSession || !reviewSession.ids.length) return;
  // 进入重做模式：独立 session，不存档
  session = { mode:'reviewRedo', title:`重做错题（${reviewSession.ids.length} 题）`, ids:reviewSession.ids.slice(), idx:0, answers:{} };
  showView('quiz'); renderQuiz();
}

/* ===== 搜题 ===== */
let searchGroup = 'all';
let searchTimer = null;
function buildGroupTabs(){
  let html = `<button class="${searchGroup==='all'?'active':''}" onclick="setSearchGroup('all')">全部</button>`;
  RANGES.forEach(([s,e])=>{
    const key = s+'-'+e;
    html += `<button class="${searchGroup===key?'active':''}" onclick="setSearchGroup('${key}')">${s}-${e}</button>`;
  });
  $('#group-tabs').innerHTML = html;
}
function setSearchGroup(g){
  searchGroup = g;
  buildGroupTabs();
  doSearch(($('#search-input')||{value:''}).value.trim());
}
function onSearchInput(){
  const v = $('#search-input').value;
  $('#search-clear').style.display = v ? '' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>doSearch(v.trim()), 180);
}
function clearSearch(){
  $('#search-input').value = '';
  $('#search-clear').style.display = 'none';
  doSearch('');
}
function highlight(text, kw){
  const safe = esc(text);
  if(!kw) return safe;
  try{
    const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    return safe.replace(re, m=>`<mark>${m}</mark>`);
  }catch(e){ return safe; }
}
function doSearch(kw){
  const box = $('#search-results');
  const oldCnt = $('#search-count'); if(oldCnt) oldCnt.remove();
  let pool;
  if(searchGroup==='all'){ pool = Q; }
  else { const [s,e] = searchGroup.split('-').map(Number); pool = Q.filter(q => q[0]>=s && q[0]<=e); }
  if(!kw){
    box.innerHTML = `<div class="sr-empty"><div class="em">🔍</div><p><b>输入题目中的文字开始搜索</b><br>支持在指定分组中查找题目和答案</p></div>`;
    return;
  }
  const k = kw.toLowerCase();
  const matched = pool.filter(q => {
    if(q[3].toLowerCase().includes(k)) return true;
    if(q[2].toLowerCase().includes(k)) return true;
    for(let i=0;i<q[4].length;i++){ if(q[4][i].toLowerCase().includes(k)) return true; }
    return false;
  });
  const cnt = document.createElement('div');
  cnt.className = 'search-result-count';
  cnt.id = 'search-count';
  cnt.innerHTML = `找到 <b>${matched.length}</b> 道匹配题目${searchGroup==='all'?'':'（分组 '+searchGroup+'）'}`;
  $('#group-tabs').after(cnt);
  if(!matched.length){
    box.innerHTML = `<div class="sr-empty"><div class="em">😶</div><p><b>没有找到匹配的题目</b><br>换个关键词或切换分组试试</p></div>`;
    return;
  }
  const letters = ['A','B','C','D','E','F'];
  let html = '';
  matched.forEach(q=>{
    const qid = q[0];
    const isJudge = q[1]===2;
    const ansL = q[5].split('、');
    let optsHtml = '';
    q[4].forEach((text,oi)=>{
      const L = letters[oi];
      const isAns = ansL.includes(L);
      optsHtml += `<div class="opt-line ${isAns?'right':''}"><span class="let">${L}</span><span>${highlight(text,kw)}</span></div>`;
    });
    html += `<div class="sr-card">
      <div class="hd">
        <span class="tag ${TYPE_TAG[q[1]]}">${TYPE_NAMES[q[1]]}</span>
        <span class="tag part">${esc(q[2])}</span>
        <span class="qid">题号 ${qid}</span>
      </div>
      <div class="stem-line">${highlight(q[3],kw)}</div>
      <div class="opts ${isJudge?'judge':''}">${optsHtml}</div>
      <div class="ans-line"><span style="background:var(--green-light);color:var(--green-dark);border-radius:8px;padding:4px 10px">正确答案：${dispAns(q,q[5])}</span></div>
    </div>`;
  });
  box.innerHTML = html;
}

/* 页面初始化：若存在进行中的会话，自动恢复到对应界面（刷新后界面不变） */
(function init(){
  const r = store.get(LS.resume, null);
  if(r && r.active && r.ids && r.ids.length){
    session = { mode:r.mode, title:r.title, ids:r.ids, idx:Math.min(r.idx, r.ids.length-1), answers:r.answers, rangeKey:r.rangeKey };
    if(r.mode==='order') prog[r.rangeKey] = { idx:session.idx, answers:session.answers };
    else if(r.mode==='random') randS = { ids:session.ids, idx:session.idx, answers:session.answers };
    else if(r.mode==='memorize') memoPos[r.rangeKey] = session.idx;
    showView('quiz'); renderQuiz();
  } else {
    showView('home');
  }
})();
</script>
</body>
</html>
